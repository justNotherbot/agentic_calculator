<!doctype html>
<html lang="en">
  <head>
    <h1>Foobar Foobar Foobar</h1>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Precision GUI Calculator</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- decimal.js via CDN (pinned) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-slate-100 text-slate-900">
    <main class="w-full max-w-sm p-4">
      <section class="bg-white shadow-xl rounded-xl overflow-hidden">
        <!-- Display -->
        <div class="bg-slate-900 text-white p-4">
          <div id="prev-display" class="h-6 text-sm text-slate-300 text-right truncate"></div>
          <div id="main-display" class="mt-1 text-right text-4xl font-mono leading-none select-none overflow-x-auto whitespace-nowrap">0</div>
        </div>

        <!-- Keypad -->
        <div class="grid grid-cols-4 gap-2 p-3">
          <button data-action="ac" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900">AC</button>
          <button data-action="pi" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900">π</button>
          <button data-action="del" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900" title="Backspace">
            <i class="fa-solid fa-delete-left"></i>
          </button>
          <button data-action="op" data-op="/" class="rounded-lg py-3 text-lg font-medium bg-indigo-200 hover:bg-indigo-300 active:bg-indigo-400 text-slate-900">÷</button>

          <button data-action="sin" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900">sin</button>
          <button data-action="cos" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900">cos</button>
          <button data-action="exp" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900">exp</button>
          <button data-action="op" data-op="*" class="rounded-lg py-3 text-lg font-medium bg-indigo-200 hover:bg-indigo-300 active:bg-indigo-400 text-slate-900">×</button>

          <button data-action="digit" data-digit="7" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">7</button>
          <button data-action="digit" data-digit="8" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">8</button>
          <button data-action="digit" data-digit="9" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">9</button>
          <button data-action="op" data-op="-" class="rounded-lg py-3 text-lg font-medium bg-indigo-200 hover:bg-indigo-300 active:bg-indigo-400 text-slate-900">−</button>

          <button data-action="digit" data-digit="4" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">4</button>
          <button data-action="digit" data-digit="5" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">5</button>
          <button data-action="digit" data-digit="6" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">6</button>
          <button data-action="op" data-op="+" class="rounded-lg py-3 text-lg font-medium bg-indigo-200 hover:bg-indigo-300 active:bg-indigo-400 text-slate-900">+</button>

          <button data-action="sqrt" class="rounded-lg py-3 text-lg font-medium bg-slate-300 hover:bg-slate-400 active:bg-slate-500 text-slate-900">√</button>
          <button data-action="digit" data-digit="1" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">1</button>
          <button data-action="digit" data-digit="2" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">2</button>
          <button data-action="digit" data-digit="3" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">3</button>

          <button data-action="op" data-op="^" class="rounded-lg py-3 text-lg font-medium bg-indigo-200 hover:bg-indigo-300 active:bg-indigo-400 text-slate-900">^</button>
          <button data-action="digit" data-digit="0" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">0</button>
          <button data-action="dot" class="rounded-lg py-3 text-lg font-medium bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-900">.</button>
          <button data-action="eq" class="rounded-lg py-3 text-lg font-medium bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white">=</button>
        </div>
      </section>
      <p class="mt-3 text-center text-xs text-slate-600">Precision by decimal.js (round half even). Scroll the main display horizontally to view extra precision. Keyboard: digits, ., + - * / ^, Enter, Backspace, Esc.</p>
    </main>

    <script type="module" src="./main.js"></script>
    <script>
      // Tailwind button presets
      tailwind.config = {
        theme: {
          extend: {}
        }
      };
    </script>
    <style>
      /* Hide horizontal scrollbar while keeping scrollability */
      #main-display { scrollbar-width: none; -ms-overflow-style: none; }
      #main-display::-webkit-scrollbar { display: none; }
    </style>
  </body>
  </html>
